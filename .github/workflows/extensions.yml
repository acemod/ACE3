name: Extensions

on:
  push:
    paths:
    - 'extension/**'
    - 'Cargo.toml'
    - 'Cargo.lock'
    - '.github/workflows/extensions.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the source code
      uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        rustup toolchain update stable --no-self-update
        rustup default stable
        rustup component add clippy rustfmt
        rustup target add x86_64-pc-windows-msvc
    - name: Run rustfmt
      run: cargo fmt -- --check
    - name: Run clippy
      run: cargo clippy --all -- -Dwarnings
    - name: Run clippy (Windows targets)
      run: cargo clippy --all --target x86_64-pc-windows-msvc -- -Dwarnings

  test:
    runs-on: ubuntu-latest
    container:
      image: xd009642/tarpaulin
      options: --security-opt seccomp=unconfined
    steps:
    - name: Checkout the source code
      uses: actions/checkout@v7
    - name: Test & Coverage
      run: cargo tarpaulin --verbose --no-default-features --workspace --timeout 240

  build:
    runs-on: "windows-latest"
    steps:
    - name: Checkout the source code
      uses: actions/checkout@v7
    - name: Install stable Rust
      uses: actions-rs/toolchain@v1
      with:
        target: "x86_64-pc-windows-msvc"
        toolchain: stable
        default: true
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
    - name: Build
      run: cargo build --verbose
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        target: "x86_64-pc-windows-msvc"
        path: target/debug/ace.dll
        if-no-files-found: error
        retention-days: 30
